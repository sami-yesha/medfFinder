<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – MedFinder</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/ds.css" />
</head>
<body class="ds-page ds-auth">
  <div id="notifications"></div>

  <nav class="ds-nav">
    <div class="ds-container ds-nav-inner">
      <a href="/" class="ds-logo"><span class="ds-logo-mark"><i data-icon="pill"></i></span><span data-i18n="common.app_name">MedFinder</span></a>
      <div class="ds-nav-end">
        <select id="language-switcher" class="ds-select" aria-label="Select Language" onchange="i18n.switchLanguage(this.value)">
          <option value="en">English</option>
          <option value="am">አማርኛ</option>
        </select>
        <button id="dark-mode-toggle" class="ds-btn ds-btn-ghost ds-btn-icon" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </nav>

  <main class="ds-auth-wrap">
    <div class="ds-auth-card">
      <div class="ds-auth-head">
        <span class="ds-tile ds-tile-lg"><i data-icon="shield-check"></i></span>
        <h1 data-i18n="login.portal">Admin / Pharmacist Portal</h1>
        <p data-i18n="login.subtitle">Sign in to manage pharmacies and stock.</p>
      </div>

      <div id="login-error" class="ds-alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <label class="ds-field">
          <span data-i18n="login.email">Email Address</span>
          <input type="email" id="email" class="ds-input" placeholder="admin@medfinder.com" required autocomplete="email" />
        </label>
        <label class="ds-field">
          <span data-i18n="login.password">Password</span>
          <span class="ds-input-wrap">
            <input type="password" id="password" class="ds-input" placeholder="Enter your password" data-i18n="login.enter_pw" required autocomplete="current-password" />
            <button type="button" id="toggle-pw" class="ds-input-btn" aria-label="Show password"><i data-icon="eye"></i></button>
          </span>
        </label>
        <button type="submit" class="ds-btn ds-btn-primary ds-btn-block" id="login-btn"><span data-i18n="login.sign_in">Sign In</span></button>
      </form>

      <a href="/" class="ds-back ds-auth-back"><i data-icon="arrow-left"></i><span data-i18n="details.back_home">Back to Home</span></a>
    </div>
  </main>

  <script src="/js/icons.js"></script>
  <script>renderStaticIcons();</script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (getAdminSession()?.token) window.location.href = '/pages/admin';

    document.addEventListener('DOMContentLoaded', async () => {
      await i18n.init();
      document.title = i18n.t('login.title');
    });

    const pwInput = document.getElementById('password');
    const pwBtn   = document.getElementById('toggle-pw');
    pwBtn.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      pwBtn.innerHTML = icon(show ? 'eye-off' : 'eye');
      pwBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email   = document.getElementById('email').value.trim();
      const btn     = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');
      errorEl.hidden = true;
      btn.disabled = true;
      btn.innerHTML = `${icon('loader-circle', 'ds-spin')}<span>${i18n.t('login.signing_in')}</span>`;
      try {
        const { token, email: adminEmail } = await API.login(email, pwInput.value);
        sessionStorage.setItem('medfinder_admin', JSON.stringify({ email: adminEmail, token }));
        showToast(i18n.t('login.welcome'));
        setTimeout(() => { window.location.href = '/pages/admin'; }, 800);
      } catch (err) {
        // Wrong credentials get the translated message; anything else (e.g. login not configured) shows the server's reason
        errorEl.innerHTML = `${icon('circle-x')}<span>${escapeHtml(/invalid/i.test(err.message) ? i18n.t('login.invalid') : err.message)}</span>`;
        errorEl.hidden = false;
        btn.disabled = false;
        btn.innerHTML = `<span>${i18n.t('login.sign_in')}</span>`;
      }
    });
  </script>
</body>
</html>
