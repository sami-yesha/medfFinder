<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Details – MedFinder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .details-layout { display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-top:2rem; }
    @media(max-width:768px){ .details-layout{ grid-template-columns:1fr; } }
    .details-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:2rem; box-shadow:var(--shadow-sm); }
    .med-hero { width:100%; height:190px; background:linear-gradient(135deg,#4f46e5,#6366f1); border-radius:.75rem; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; margin-bottom:1.5rem; }
    .ph-hero  { width:100%; height:190px; background:linear-gradient(135deg,#0891b2,#0284c7); border-radius:.75rem; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; margin-bottom:1.5rem; }
    .med-hero .icon, .ph-hero .icon { font-size:4rem; }
    .details-title { font-size:1.75rem; font-weight:800; margin-bottom:.5rem; }
    .detail-row { display:flex; align-items:flex-start; gap:1rem; padding:.875rem 0; border-bottom:1px solid var(--border); }
    .detail-row:last-child { border-bottom:none; }
    .detail-icon { width:2.25rem; height:2.25rem; background:var(--bg-main); border-radius:.5rem; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
    .detail-label { font-size:.75rem; text-transform:uppercase; font-weight:600; color:var(--text-muted); letter-spacing:.05em; }
    .detail-value { font-size:.95rem; font-weight:600; }
    .price-display { font-size:2rem; font-weight:800; color:var(--primary); }
    .btn-back { display:inline-flex; align-items:center; gap:.5rem; background:var(--bg-card); border:1px solid var(--border); border-radius:.75rem; padding:.65rem 1.25rem; font-weight:600; cursor:pointer; transition:var(--transition); color:var(--text-main); margin-bottom:1.5rem; text-decoration:none; }
    .btn-back:hover { border-color:var(--primary); color:var(--primary); }
    #detail-map { height:260px; border-radius:.5rem; }
    .not-found { text-align:center; padding:5rem 2rem; color:var(--text-muted); }
    /* Pharmacy medicines list */
    .med-list { display:flex; flex-direction:column; gap:.75rem; margin-top:1rem; }
    .med-list-item {
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
      gap:.5rem; padding:.875rem 1rem; border-radius:.75rem;
      background:var(--bg-main); border:1px solid var(--border);
    }
    .med-list-name { font-weight:700; font-size:.95rem; }
    .med-list-meta { font-size:.82rem; color:var(--text-muted); margin-top:.1rem; }
    .med-list-right { display:flex; align-items:center; gap:.75rem; flex-shrink:0; }
    .med-list-price { font-weight:700; color:var(--primary); }
  </style>
</head>
<body>
  <div id="notifications"></div>

  <nav class="navbar" role="navigation">
    <div class="container nav-container">
      <a href="/" class="logo">💊 MedFinder</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="/" class="nav-link" data-i18n="nav.home">Home</a></li>
      </ul>
      <div style="display:flex;gap:.75rem;align-items:center;">
        <select id="language-switcher" aria-label="Select Language" onchange="i18n.switchLanguage(this.value)">
          <option value="en">English</option>
          <option value="am">አማርኛ</option>
        </select>
        <button id="dark-mode-toggle" aria-label="Toggle dark mode" style="background:var(--bg-main);border:1px solid var(--border);border-radius:.5rem;width:2.5rem;height:2.5rem;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;">🌙</button>
        <button id="hamburger" aria-label="Menu" style="background:none;border:none;font-size:1.5rem;cursor:pointer;display:none;">☰</button>
      </div>
    </div>
  </nav>

  <style>
    @media (max-width: 768px) {
      #hamburger { display: block !important; }
      #nav-links { 
        display: none; position: absolute; top: 4.5rem; left: 0; right: 0; 
        background: var(--bg-card); border-bottom: 1px solid var(--border); 
        padding: 1rem; flex-direction: column; gap: 1rem; z-index: 1000; 
      }
      #nav-links.nav-open { display: flex; }
    }
  </style>

  <main>
    <div class="container" style="padding-top:2rem;padding-bottom:4rem;">
      <a href="/" class="btn-back" data-i18n="details.back_home">← Back to Home</a>
      <div id="details-content"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/map.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await i18n.init();

      const params     = new URLSearchParams(window.location.search);
      const pharmacyId = params.get('pharmacyId');
      const medicineId = params.get('medicineId');
      const container  = document.getElementById('details-content');

      if (!pharmacyId) return renderNotFound(container, 'Missing pharmacyId in URL.');

      try {
        const pharmacy = await API.getPharmacyById(pharmacyId);

        if (medicineId) {
          // Medicine detail view (from medicine search cards)
          const medicine = pharmacy.medicines.find(m => m._id === medicineId);
          if (!medicine) return renderNotFound(container, 'Medicine not found in this pharmacy.');
          renderMedicineDetails(container, pharmacy, medicine);
        } else {
          // Pharmacy profile view (from location search "View Details")
          renderPharmacyProfile(container, pharmacy);
        }

        // Re-render on language change
        window.addEventListener('languageChanged', () => {
           if (medicineId) {
             const medicine = pharmacy.medicines.find(m => m._id === medicineId);
             renderMedicineDetails(container, pharmacy, medicine);
           } else {
             renderPharmacyProfile(container, pharmacy);
           }
        });

      } catch (err) {
        renderNotFound(container, err.message);
      }
    });

    function renderNotFound(container, reason) {
      container.innerHTML = `
        <div class="not-found">
          <div style="font-size:4rem;margin-bottom:1rem;">😕</div>
          <h1 style="font-size:1.75rem;color:var(--text-main);margin-bottom:.5rem;" data-i18n="details.not_found">${i18n.t('details.not_found')}</h1>
          <p>${reason}</p>
          <a href="/" style="display:inline-block;margin-top:1.5rem;background:var(--primary);color:white;padding:.75rem 2rem;border-radius:.75rem;font-weight:600;" data-i18n="details.back_home">${i18n.t('details.back_home')}</a>
        </div>`;
    }

    // ── MEDICINE DETAIL VIEW (pharmacyId + medicineId) ──────────
    function renderMedicineDetails(container, pharmacy, med) {
      document.title = `${med.name} – MedFinder`;
      const avail = med.stock.isAvailable;
      container.innerHTML = `
        <div class="details-layout">
          <div>
            <div class="med-hero"><span class="icon">💊</span><p style="opacity:.8;margin-top:.5rem;">${med.name}</p></div>
            <div class="details-card">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.75rem;">
                <h1 class="details-title">${med.name}</h1>
                <span class="badge ${avail ? 'badge-available' : 'badge-unavailable'}" style="white-space:nowrap;">
                  ${avail ? '✓ ' + i18n.t('details.available') : '✗ ' + i18n.t('details.out_of_stock')}
                </span>
              </div>
              <p style="color:var(--text-muted);margin-bottom:1.5rem;line-height:1.75;">${med.description}</p>
              <div class="detail-row">
                <div class="detail-icon">💰</div>
                <div><div class="detail-label">${i18n.t('details.price')}</div>
                  <div class="price-display">${med.pricing.amount} <span style="font-size:1.25rem;">${med.pricing.currency}</span></div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-icon">📦</div>
                <div><div class="detail-label">${i18n.t('details.stock')}</div>
                  <div class="detail-value">${avail
                    ? `<span style="color:var(--secondary)">${i18n.t('details.units_in_stock', { count: med.stock.quantity })}</span>`
                    : `<span style="color:var(--error)">${i18n.t('details.currently_out')}</span>`}</div>
                </div>
              </div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:1.5rem;">
            <div class="details-card">
              <p style="font-size:.7rem;text-transform:uppercase;font-weight:700;color:var(--text-muted);letter-spacing:.1em;margin-bottom:1rem;">🏥 ${i18n.t('details.pharm_details')}</p>
              <div class="detail-row"><div class="detail-icon">🏥</div>
                <div><div class="detail-label">${i18n.t('details.name')}</div><div class="detail-value">${pharmacy.name}</div></div>
              </div>
              <div class="detail-row"><div class="detail-icon">📍</div>
                <div><div class="detail-label">${i18n.t('details.address')}</div><div class="detail-value">${pharmacy.address || '—'}</div></div>
              </div>
              <div class="detail-row"><div class="detail-icon">📞</div>
                <div><div class="detail-label">${i18n.t('details.phone')}</div>
                  <div class="detail-value">${pharmacy.phone
                    ? `<a href="tel:${pharmacy.phone}" style="color:var(--primary);">${pharmacy.phone}</a>`
                    : '—'}</div>
                </div>
              </div>
              <div class="detail-row"><div class="detail-icon">🌍</div>
                <div><div class="detail-label">${i18n.t('details.coords')}</div>
                  <div class="detail-value" style="font-family:monospace;font-size:.85rem;">${pharmacy.location.lat.toFixed(4)}, ${pharmacy.location.lng.toFixed(4)}</div>
                </div>
              </div>
            </div>
            <div class="details-card" style="padding:1.25rem;">
              <p style="font-size:.7rem;text-transform:uppercase;font-weight:700;color:var(--text-muted);letter-spacing:.1em;margin-bottom:1rem;">📍 ${i18n.t('details.map_loc')}</p>
              <div id="detail-map"></div>
            </div>
          </div>
        </div>`;
      initDetailMap(pharmacy.location.lat, pharmacy.location.lng, pharmacy.name);
    }

    // ── PHARMACY PROFILE VIEW (pharmacyId only) ─────────────────
    function renderPharmacyProfile(container, pharmacy) {
      document.title = `${pharmacy.name} – MedFinder`;
      const available = pharmacy.medicines.filter(m => m.stock.isAvailable);

      const medItem = (med) => {
        const avail = med.stock.isAvailable;
        return `
          <div class="med-list-item">
            <div>
              <div class="med-list-name">💊 ${med.name}</div>
              <div class="med-list-meta">${med.description || ''}</div>
            </div>
            <div class="med-list-right">
              <span class="med-list-price">${med.pricing.amount} ${med.pricing.currency}</span>
              <span class="badge ${avail ? 'badge-available' : 'badge-unavailable'}" style="font-size:.75rem;">
                ${avail ? '✓ ' + i18n.t('details.available') : '✗ ' + i18n.t('details.out_of_stock')}
              </span>
            </div>
          </div>`;
      };

      container.innerHTML = `
        <div class="details-layout">
          <div>
            <div class="ph-hero">
              <span class="icon">🏥</span>
              <p style="opacity:.85;margin-top:.5rem;font-weight:700;">${pharmacy.name}</p>
            </div>
            <div class="details-card">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.75rem;">
                <h1 class="details-title">${pharmacy.name}</h1>
                <span class="badge badge-available" style="white-space:nowrap;">${i18n.t('details.units_in_stock', { count: available.length })}</span>
              </div>
              <div class="detail-row"><div class="detail-icon">📍</div>
                <div><div class="detail-label">${i18n.t('details.address')}</div><div class="detail-value">${pharmacy.address || '—'}</div></div>
              </div>
              <div class="detail-row"><div class="detail-icon">📞</div>
                <div><div class="detail-label">${i18n.t('details.phone')}</div>
                  <div class="detail-value">${pharmacy.phone
                    ? `<a href="tel:${pharmacy.phone}" style="color:var(--primary);">${pharmacy.phone}</a>`
                    : '—'}</div>
                </div>
              </div>
              <div class="detail-row"><div class="detail-icon">💊</div>
                <div><div class="detail-label">${i18n.t('details.total_meds')}</div>
                  <div class="detail-value">${i18n.t('details.listed_avail', { count: pharmacy.medicines.length, avail: available.length })}</div>
                </div>
              </div>
              <div class="detail-row"><div class="detail-icon">🌍</div>
                <div><div class="detail-label">${i18n.t('details.coords')}</div>
                  <div class="detail-value" style="font-family:monospace;font-size:.85rem;">${pharmacy.location.lat.toFixed(4)}, ${pharmacy.location.lng.toFixed(4)}</div>
                </div>
              </div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:1.5rem;">
            <div class="details-card" style="padding:1.25rem;">
              <p style="font-size:.7rem;text-transform:uppercase;font-weight:700;color:var(--text-muted);letter-spacing:.1em;margin-bottom:1rem;">📍 ${i18n.t('details.map_loc')}</p>
              <div id="detail-map"></div>
            </div>
            <div class="details-card">
              <p style="font-size:.7rem;text-transform:uppercase;font-weight:700;color:var(--text-muted);letter-spacing:.1em;margin-bottom:1rem;">
                💊 ${i18n.t('details.all_meds')} (${pharmacy.medicines.length})
              </p>
              ${pharmacy.medicines.length
                ? `<div class="med-list">${pharmacy.medicines.map(medItem).join('')}</div>`
                : `<p style="color:var(--text-muted);text-align:center;padding:1.5rem;">${i18n.t('details.no_meds_reg')}</p>`
              }
            </div>
          </div>
        </div>`;

      initDetailMap(pharmacy.location.lat, pharmacy.location.lng, pharmacy.name);
    }
  </script>
</body>
</html>
