<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Details – MedFinder</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/ds.css" />
</head>
<body class="ds-page">
  <div id="notifications"></div>

  <nav class="ds-nav">
    <div class="ds-container ds-nav-inner">
      <a href="/" class="ds-logo"><span class="ds-logo-mark"><i data-icon="pill"></i></span><span data-i18n="common.app_name">MedFinder</span></a>
      <div class="ds-nav-links">
        <a href="/#results" data-i18n="nav.find">Find medicine</a>
        <a href="/#how" data-i18n="nav.how">How it works</a>
      </div>
      <div class="ds-nav-end">
        <select id="language-switcher" class="ds-select" aria-label="Select Language" onchange="i18n.switchLanguage(this.value)">
          <option value="en">English</option>
          <option value="am">አማርኛ</option>
        </select>
        <button id="dark-mode-toggle" class="ds-btn ds-btn-ghost ds-btn-icon" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </nav>

  <main class="ds-container ds-details">
    <a href="/" class="ds-back" id="back-link"><i data-icon="arrow-left"></i><span data-i18n="details.back_search">Back to search</span></a>
    <div id="details-content"></div>
  </main>

  <footer class="ds-footer">
    <div class="ds-container ds-footer-inner">
      <a href="/" class="ds-logo"><span class="ds-logo-mark"><i data-icon="pill"></i></span><span data-i18n="common.app_name">MedFinder</span></a>
      <p data-i18n="footer.short">Helping you find medicines faster.</p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/icons.js"></script>
  <script>renderStaticIcons();</script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/nearby.js"></script>
  <script src="/js/compare.js"></script>
  <script>
    const LOW_STOCK_THRESHOLD = 10;
    let detailMap = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await i18n.init();

      // Coming from our own search page? Go back to it (keeps the user's search and scroll)
      document.getElementById('back-link').addEventListener('click', e => {
        if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
          e.preventDefault();
          history.back();
        }
      });

      const params     = new URLSearchParams(window.location.search);
      const pharmacyId = params.get('pharmacyId');
      const medicineId = params.get('medicineId');
      const container  = document.getElementById('details-content');

      if (!pharmacyId) return renderNotFound(container, 'Missing pharmacyId in URL.');

      try {
        const pharmacy = await API.getPharmacyById(pharmacyId);
        const medicine = medicineId ? pharmacy.medicines.find(m => m._id === medicineId) : null;
        if (medicineId && !medicine) return renderNotFound(container, 'Medicine not found in this pharmacy.');

        const render = () => medicine
          ? renderMedicineDetails(container, pharmacy, medicine)   // from a medicine card
          : renderPharmacyProfile(container, pharmacy);           // from "see all medicines here"
        render();
        window.addEventListener('languageChanged', render);
        window.addEventListener('userLocationChanged', render);
      } catch (err) {
        renderNotFound(container, err.message);
      }
    });

    function renderNotFound(container, reason) {
      container.innerHTML = `
        <div class="ds-empty">
          <span class="ds-empty-icon">${icon('search-x')}</span>
          <h3>${i18n.t('details.not_found')}</h3>
          <p>${escapeHtml(reason)}</p>
          <a href="/" class="ds-btn ds-btn-primary" style="margin-top:1.25rem;">${icon('arrow-left')}${i18n.t('details.back_home')}</a>
        </div>`;
    }

    function stockPill(med) {
      if (!med.stock.isAvailable) return `<span class="ds-pill ds-pill-bad">${icon('x')}${i18n.t('stock.out')}</span>`;
      if (med.stock.quantity <= LOW_STOCK_THRESHOLD) return `<span class="ds-pill ds-pill-warn">${icon('triangle-alert')}${i18n.t('stock.low')}</span>`;
      return `<span class="ds-pill ds-pill-ok">${icon('check')}${i18n.t('stock.in')}</span>`;
    }

    /** Pharmacy name, address, distance, phone + Directions / Call */
    function pharmacyBlock(pharmacy, { linkToProfile = false } = {}) {
      const km  = Nearby.distanceTo(pharmacy.location);
      const dir = Nearby.directionsUrl(pharmacy.location);
      const tel = Nearby.telUrl(pharmacy.phone);
      return `
        <div class="ds-place">
          <span class="ds-tile">${icon('store')}</span>
          <div class="ds-place-text">
            <strong>${escapeHtml(pharmacy.name)}</strong>
            ${pharmacy.address ? `<span>${icon('map-pin')}${escapeHtml(pharmacy.address)}</span>` : ''}
            ${pharmacy.phone ? `<span>${icon('phone')}${escapeHtml(pharmacy.phone)}</span>` : ''}
          </div>
          ${km != null ? `<span class="ds-pill ds-pill-info">${icon('navigation')}${Nearby.formatDistance(km)}</span>` : ''}
        </div>
        <div class="ds-place-actions">
          ${dir ? `<a class="ds-btn ds-btn-primary" href="${dir}" target="_blank" rel="noopener">${icon('navigation-2')}${i18n.t('near.directions')}</a>` : ''}
          ${tel ? `<a class="ds-btn ds-btn-ghost" href="${tel}">${icon('phone')}${i18n.t('near.call')}</a>` : ''}
          ${linkToProfile ? `<a class="ds-link" href="/pages/details?pharmacyId=${pharmacy._id}">${i18n.t('details.view_pharmacy')}${icon('chevron-right')}</a>` : ''}
        </div>`;
    }

    function mapCard() {
      return `
        <div class="ds-panel ds-map-card">
          <div id="detail-map" class="ds-map"></div>
        </div>`;
    }

    /** Map with one pin for the pharmacy (price or name) and the user's dot when nearby */
    function initMap(pharmacy, label) {
      if (detailMap) { detailMap.remove(); detailMap = null; }
      const { lat, lng } = pharmacy.location || {};
      if (!lat && !lng) return;

      detailMap = L.map('detail-map', { zoomControl: false, scrollWheelZoom: false }).setView([lat, lng], 15);
      L.control.zoom({ position: 'bottomright' }).addTo(detailMap);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19
      }).addTo(detailMap);
      L.marker([lat, lng], {
        icon: L.divIcon({ className: '', iconSize: null, iconAnchor: [0, 0], html: `<div class="ds-price-pin">${label}</div>` })
      }).addTo(detailMap);

      // Frame the user too when they're within reach
      if (Nearby.showOnMap(detailMap) && Nearby.distanceTo(pharmacy.location) <= 30) {
        detailMap.fitBounds([[lat, lng], [Nearby.location.lat, Nearby.location.lng]], { padding: [50, 50], maxZoom: 16 });
      }
    }

    // ── MEDICINE VIEW (pharmacyId + medicineId) ─────────────────
    function renderMedicineDetails(container, pharmacy, med) {
      document.title = `${med.name} – MedFinder`;
      const avail = med.stock.isAvailable;
      const price = `${escapeHtml(med.pricing.amount)} ${escapeHtml(med.pricing.currency)}`;

      container.innerHTML = `
        <div class="ds-details-grid">
          <div class="ds-details-main">
            <section class="ds-panel ds-med-header">
              <span class="ds-tile ds-tile-lg">${icon('pill')}</span>
              <div class="ds-med-title">
                <h1>${escapeHtml(med.name)}</h1>
                ${med.description ? `<p>${escapeHtml(med.description)}</p>` : ''}
                <div class="ds-card-meta">
                  ${stockPill(med)}
                  <span class="ds-stock-note">${avail
                    ? i18n.t('details.units_in_stock', { count: escapeHtml(med.stock.quantity) })
                    : i18n.t('details.currently_out')}</span>
                </div>
              </div>
              <div class="ds-med-price ${avail ? '' : 'is-out'}">
                <b>${escapeHtml(med.pricing.amount)}</b><small>${escapeHtml(med.pricing.currency)}</small>
              </div>
            </section>

            <section class="ds-panel">
              <h2 class="ds-panel-title">${i18n.t('details.where')}</h2>
              ${pharmacyBlock(pharmacy, { linkToProfile: true })}
            </section>

            <section class="ds-panel">
              <h2 class="ds-panel-title">${i18n.t('compare.other_pharmacies')}</h2>
              <div id="compare-inline"><p class="compare-loading">${icon('loader-circle', 'ds-spin')} ${i18n.t('search.searching')}</p></div>
            </section>
          </div>
          <aside class="ds-details-side">${mapCard()}</aside>
        </div>`;

      initMap(pharmacy, avail ? price : escapeHtml(pharmacy.name));
      loadInlineComparison(med.name, pharmacy._id);
    }

    // Same medicine at every pharmacy, cheapest in stock first
    async function loadInlineComparison(medicineName, currentPharmacyId) {
      const box = document.getElementById('compare-inline');
      try {
        const rows = await fetchComparison(medicineName);
        if (!document.body.contains(box)) return; // re-rendered meanwhile
        box.innerHTML = rows.length > 1
          ? renderComparison(rows, { currentPharmacyId })
          : `<p class="ds-muted">${i18n.t('compare.only_here')}</p>`;
      } catch (err) {
        box.innerHTML = `<p class="ds-muted" style="color:var(--bad)">${escapeHtml(err.message)}</p>`;
      }
    }

    // ── PHARMACY VIEW (pharmacyId only) ─────────────────────────
    function renderPharmacyProfile(container, pharmacy) {
      document.title = `${pharmacy.name} – MedFinder`;
      const meds = [...pharmacy.medicines].sort((a, b) => (b.stock.isAvailable - a.stock.isAvailable) || a.name.localeCompare(b.name));
      const available = meds.filter(m => m.stock.isAvailable).length;

      const medRow = (m) => `
        <a class="ds-med-row ${m.stock.isAvailable ? '' : 'is-out'}" href="/pages/details?pharmacyId=${pharmacy._id}&medicineId=${m._id}">
          <div class="ds-med-row-text">
            <strong>${escapeHtml(m.name)}</strong>
            ${m.description ? `<span>${escapeHtml(m.description)}</span>` : ''}
          </div>
          ${stockPill(m)}
          <b class="ds-med-row-price">${escapeHtml(m.pricing.amount)} ${escapeHtml(m.pricing.currency)}</b>
          ${icon('chevron-right', 'ds-med-row-chevron')}
        </a>`;

      container.innerHTML = `
        <div class="ds-details-grid">
          <div class="ds-details-main">
            <section class="ds-panel">
              ${pharmacyBlock(pharmacy)}
            </section>

            <section class="ds-panel">
              <div class="ds-panel-head">
                <h2 class="ds-panel-title">${i18n.t('details.all_meds')}</h2>
                <span class="ds-muted">${i18n.t('details.listed_avail', { count: meds.length, avail: available })}</span>
              </div>
              ${meds.length
                ? `<div class="ds-med-list">${meds.map(medRow).join('')}</div>`
                : `<p class="ds-muted">${i18n.t('details.no_meds_reg')}</p>`}
            </section>
          </div>
          <aside class="ds-details-side">${mapCard()}</aside>
        </div>`;

      initMap(pharmacy, escapeHtml(pharmacy.name));
    }
  </script>
</body>
</html>
